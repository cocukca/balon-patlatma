<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5aa5" />
    <meta
      name="description"
      content="Balonların içindeki hayvanları patlat, skorunu artır ve hayvan adlarını Türkçe dinle."
    />
    <title>Balon Patlatma Oyunu</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <main id="celebration-container" aria-label="Balon Patlatma Oyunu">
      <section id="game-panel" aria-label="Oyun kontrolleri">
        <div id="controls">
          <button id="sound-toggle" class="icon-button" type="button" aria-pressed="true" aria-label="Müziği kapat" title="Müziği kapat">♫</button>
        </div>
      </section>

      <section id="score-board" aria-live="polite">Henüz balon patlatılmadı.</section>

      <div id="balloon-container" aria-hidden="true"></div>
      <canvas id="fireworks-canvas" aria-hidden="true"></canvas>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
